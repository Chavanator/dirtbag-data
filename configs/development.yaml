# Development configuration — DirtBag Data
# Overridable via environment variables (see .env.example).

database:
  url: postgresql+psycopg://dirtbag:dirtbag@localhost:5433/dirtbag

storage:
  raw_path: ./data/local/raw

http:
  timeout: 20
  max_retries: 3
  rate_limit_seconds: 1.5
  user_agent: "DirtBagBot/0.1 (+https://dirtbag.vercel.app)"

crawlers:
  sources:
    thecrag:
      enabled: true
      base_url: https://www.thecrag.com
      seeds:
        el-salto: https://www.thecrag.com/en/climbing/mexico/el-salto
    mountain_project:
      enabled: false
      base_url: https://www.mountainproject.com
    eighta:
      enabled: false
      base_url: https://www.8a.nu

logging:
  level: DEBUG
