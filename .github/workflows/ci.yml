# CI: lint + tests en cada push/PR.
#
# NOTA de ubicación: este workflow asume que `dirtbag-data/` será la raíz de
# su propio repositorio en GitHub. Si el repo es la carpeta `dirtbag/`
# completa, mueve este archivo a `dirtbag/.github/workflows/ci.yml` y añade
# `defaults.run.working-directory: dirtbag-data` a los jobs.
#
# Minutos: repo público → ilimitados; privado → 2.000 min/mes (plan Free).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest
